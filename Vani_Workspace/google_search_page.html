<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Search — Built by Vāṇī AI</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #202124; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .logo { font-size: 5rem; font-weight: 700; letter-spacing: -2px; margin-bottom: 1.8rem; }
    .logo span:nth-child(1) { color: #4285f4; }
    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }
    form { width: 100%; max-width: 580px; display: flex; flex-direction: column; align-items: center; }
    input { width: 100%; padding: 0.95rem 1.4rem; border-radius: 24px; border: 1px solid #5f6368; background: #202124; color: #fff; font-size: 1rem; outline: none; }
    input:focus { background: #303134; border-color: transparent; box-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .btns { margin-top: 1.8rem; display: flex; gap: 0.8rem; }
    button { background: #303134; color: #e8eaed; border: 1px solid transparent; padding: 0.65rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { border-color: #5f6368; }
  </style>
</head>
<body>
  <div class="logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
  <form action="https://www.google.com/search" method="GET">
    <input type="text" name="q" placeholder="Search Google or type a URL..." autofocus />
    <div class="btns">
      <button type="submit">Google Search</button>
      <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
    </div>
  </form>
</body>
</html>
